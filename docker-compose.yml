services:
  postgres:
    image: postgres:16-alpine
    container_name: caijiao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zzl_agents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zzl-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zzl_agents}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zzl-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - zzl-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: zzl-api
    restart: unless-stopped
    environment:
      API_APP_NAME: ${API_APP_NAME:-ZZLAgent API}
      API_ENV: ${API_ENV:-development}
      API_VERSION: ${API_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-["*"]}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-["*"]}
    ports:
      - "${API_PORT:-8000}:8000"
    expose:
      - "8000"
    networks:
      - zzl-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./ui
      args:
        API_PROXY_URL: ${UI_API_PROXY_URL:-http://api:8000/api/:path*}
    container_name: zzl-ui
    restart: unless-stopped
    environment:
      API_PROXY_URL: ${UI_API_PROXY_URL:-http://api:8000/api/:path*}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${UI_PORT:-3000}:3000"
    expose:
      - "3000"
    networks:
      - zzl-network
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: zzl-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zzl-network
    depends_on:
      - ui
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  zzl-network:
    name: zzl-network
    driver: bridge
